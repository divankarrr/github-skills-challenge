name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install testing and coverage tools
        run: python -m pip install pytest pytest-cov coverage

      - name: Run tests and generate coverage
        run: >-
          PYTHONPATH=.
          python -m pytest --verbose --cov=src --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Publish coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 50

      - name: Enforce minimum coverage
        run: python -m coverage report --fail-under=50